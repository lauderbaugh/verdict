name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject and the interpreter the
        # project is developed on; 3.13 guards against drift.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      # The suite is entirely offline and needs no secrets. If a test ever
      # reaches the network it will fail here rather than in production.
      - name: Run tests
        run: pytest

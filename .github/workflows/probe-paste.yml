name: probe-paste

# Manual only. Answers one question: is Paste reachable from a GitHub
# runner at all? The weekly job logs `index_unavailable: HTTP Error 403`
# while the same request from a laptop returns 200, which points at the
# runner's IP rather than anything we send.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Probe
        run: |
          python - <<'PY'
          import urllib.request, urllib.error

          UA = "verdict/0.1 (+https://github.com/lauderbaugh/verdict)"
          TARGETS = {
              "reviews index": "https://www.pastemagazine.com/articles/music/reviews",
              "homepage":      "https://www.pastemagazine.com/",
              "robots.txt":    "https://www.pastemagazine.com/robots.txt",
              # Controls: these work from the weekly job, so if they fail
              # here the problem is the runner's network, not Paste.
              "pitchfork feed": "https://pitchfork.com/feed/feed-news/rss",
              "npr feed":       "https://feeds.npr.org/510019/podcast.xml",
          }

          # Header sets are honest variations, not disguises. The UA always
          # identifies this project; the only additions are the Accept
          # headers any ordinary HTTP client sends.
          VARIANTS = {
              "bare UA": {"User-Agent": UA},
              "UA + Accept": {
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          }

          for label, url in TARGETS.items():
              for variant, headers in VARIANTS.items():
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          print(f"{label:16} {variant:12} {response.status} "
                                f"{len(response.read()):>8} bytes")
                  except urllib.error.HTTPError as exc:
                      print(f"{label:16} {variant:12} HTTP {exc.code} {exc.reason}")
                  except Exception as exc:
                      print(f"{label:16} {variant:12} {type(exc).__name__}: {exc}")
          PY
